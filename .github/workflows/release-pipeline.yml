# Builds a signed, per-platform release of this service.
#
# Rename `name:` below when you clone this template into a new service. Nothing
# else in this file needs editing: the artefact names come from the repository
# name, so the four lines that differed between the first two hand-copied
# pipelines cannot drift here.
#
# TRIGGER: pushes to `prod`, and nothing else.
#
#   GitHub runs a branch-triggered workflow AS IT EXISTS ON THE BRANCH THAT WAS
#   PUSHED. A `prod` branch created before this file existed does not contain
#   it, so pushing to `prod` runs whatever workflows that branch does have and
#   this one silently never fires -- no error, no run, no release. That is why
#   two finished pipelines in this org have never produced a release. Keep
#   `prod` current with `main`.
#
#   There is deliberately no `pull_request` trigger. Three of the service
#   repositories are PUBLIC, and a workflow reachable from a fork's pull
#   request must never be able to reach SERVICE_SIGNING_KEY. Pinned by
#   test/test_release_pipeline.py::test_nothing_but_a_push_to_prod_triggers_a_release
name: service-template release

on:
  push:
    branches: [ "prod" ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    # No secret is available to this job, by design. It runs on three runners
    # including Windows and macOS; the signing key is needed on exactly one, so
    # it is used in `release` instead and never reaches the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: windows-amd64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify project structure
        run: |
          set -euo pipefail
          test -f app/main.py
          test -f requirements.txt
          test -d app/dependencies
          test -f app/dependencies/config.yaml
          echo "Layout looks like a Bytronic service."

      # Pinned to a commit rather than @master: this action turns source into
      # the binary a customer runs, so "whatever master is today" is a change
      # to a shipped artefact that no one here reviewed.
      - name: Build application
        uses: espressif/python-binary-action@b7d9c899ef131570d6be8b7ba7c8d21f9b268c82
        with:
          scripts: "app/main.py"
          output-dir: "./dist/${{ matrix.platform }}"
          target-platform: ${{ matrix.platform }}
          # requirements.txt is runtime-only, so the binary does not carry a
          # test framework around with it.
          install-deps-command: >-
            uv pip install
            -r requirements.txt
          # app/main.py imports `dependencies`, which resolves at runtime only
          # because Python puts a script's own directory on sys.path. PyInstaller
          # is invoked from the repository root, so without this it analyses
          # main.py with only the root on the search path, cannot resolve
          # `dependencies`, and builds a binary that dies on its first import.
          # It BUILDS cleanly -- the failure appears when the binary is run.
          # Pinned by
          # test/test_release_pipeline.py::test_the_build_puts_app_on_the_import_path
          additional-args: --paths app
          include-data-dirs: |
            {
              "*": [
                "./app/dependencies"
              ]
            }

      - name: Add editable config and logs folder
        run: |
          set -euo pipefail
          output_dir="./dist/${{ matrix.platform }}"
          # Beside the executable, so an operator can edit it after extracting.
          cp app/dependencies/config.yaml "$output_dir/config.yaml"
          mkdir -p "$output_dir/logs"
          touch "$output_dir/logs/.gitkeep"

      - name: Verify build output
        run: |
          set -euo pipefail
          output_dir="./dist/${{ matrix.platform }}"
          test -f "$output_dir/config.yaml"
          test -d "$output_dir/logs"
          test "$(find "$output_dir" -type f | wc -l)" -gt 1

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: "./dist/${{ matrix.platform }}"
          if-no-files-found: error

  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install signing dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-signing.txt

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Package each platform
        env:
          SERVICE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          found=0
          for dir in build/build-*; do
            platform="${dir#build/build-}"
            ( cd "$dir" && zip -qr "../../upload/${SERVICE}-${platform}.zip" . )
            found=$((found + 1))
          done
          # A silent zero here would publish a release with no binaries in it,
          # and `gh release create` succeeds perfectly well with no files.
          if [ "$found" -eq 0 ]; then
            echo "::error::no platform artifacts were downloaded - nothing to release"
            exit 1
          fi
          echo "Packaged ${found} platform(s):"
          ls -lh upload

      # The only step that sees the signing key. It refuses to sign unless the
      # secret's public half matches the one committed in scripts/sign.py, so a
      # secret pasted from the wrong place fails here rather than on a customer
      # machine months later.
      - name: Sign the release artefacts
        env:
          SERVICE_SIGNING_KEY: ${{ secrets.SERVICE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python scripts/sign.py upload/*.zip
          ls -l upload/*.sig

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd upload && sha256sum *.zip *.sig > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: prod-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Production build ${TAG#prod-}" \
            --generate-notes \
            upload/*.zip upload/*.sig upload/SHA256SUMS
